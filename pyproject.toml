[tool.poetry]
name = "automojo-automationkit"
description = "Automation Mojo - Automation Kit"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="mojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = ">6.0.1"

automojo-arcli = { git = "https://github.com/automationmojo/automojo-arcli.git", branch = "main" }
automojo-configuration = { git = "https://github.com/automationmojo/automojo-configuration.git", branch = "main" }
automojo-credentials = { git = "https://github.com/automationmojo/automojo-credentials.git", branch = "main" }
automojo-dataprofiles = { git = "https://github.com/automationmojo/automojo-dataprofiles.git", branch = "main" }
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-extension = { git = "https://github.com/automationmojo/automojo-extension.git", branch = "main" }
automojo-interfaces = { git = "https://github.com/automationmojo/automojo-interfaces.git", branch = "main" }
automojo-interop = { git = "https://github.com/automationmojo/automojo-interop.git", branch = "main" }
automojo-interop-ext-bluetooth = { git = "https://github.com/automationmojo/automojo-interop-ext-bluetooth.git", branch = "main" }
automojo-interop-ext-can = { git = "https://github.com/automationmojo/automojo-interop-ext-can.git", branch = "main" }
automojo-interop-ext-tasker = { git = "https://github.com/automationmojo/automojo-interop-ext-tasker.git", branch = "main" }
automojo-interop-ext-upnp = { git = "https://github.com/automationmojo/automojo-interop-ext-upnp.git", branch = "main" }
automojo-landscaping = { git = "https://github.com/automationmojo/automojo-landscaping.git", branch = "main" }
automojo-networking = { git = "https://github.com/automationmojo/automojo-networking.git", branch = "main" }
automojo-runtime = { git = "https://github.com/automationmojo/automojo-runtime.git", branch = "main" }
automojo-storage-database = { git = "https://github.com/automationmojo/automojo-storage-database.git", branch = "main" }
automojo-testbase = { git = "https://github.com/automationmojo/automojo-testbase.git", branch = "main" }
automojo-testplus = { git = "https://github.com/automationmojo/automojo-testplus.git", branch = "main" }
automojo-this-app = { git = "https://github.com/automationmojo/automojo-this-app.git", branch = "main" }
automojo-xmodules = { git = "https://github.com/automationmojo/automojo-xmodules.git", branch = "main" }

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
