[tool.poetry]
name = "codecraftai-automationkit"
description = "Code Craft AI - Automation Kit"
version = "1.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.1"

codecraftai-arcli = { version = "<2.0.0", source = "codecraftai" }
codecraftai-configuration = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-dataprofiles = { version = "<2.0.0", source = "codecraftai" }
codecraftai-foundations = { version = "<2.0.0", source = "codecraftai" }
codecraftai-extension = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop-ext-bluetooth = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop-ext-can = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop-ext-tasker = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interop-ext-upnp = { version = "<2.0.0", source = "codecraftai" }
codecraftai-landscaping = { version = "<2.0.0", source = "codecraftai" }
codecraftai-networking = { version = "<2.0.0", source = "codecraftai" }
codecraftai-runtime = { version = "<2.0.0", source = "codecraftai" }
codecraftai-storage-database = { version = "<2.0.0", source = "codecraftai" }
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }
codecraftai-testplus = { version = "<2.0.0", source = "codecraftai" }
codecraftai-this-app = { version = "<2.0.0", source = "codecraftai" }
codecraftai-xmodules = { version = "<2.0.0", source = "codecraftai" }

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
