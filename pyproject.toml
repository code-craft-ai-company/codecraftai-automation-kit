[tool.poetry]
name = "codecraftai-automationkit"
description = "Code Craft AI - Automation Kit"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="mojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = ">6.0.1"

codecraftai-arcli = { git = "https://github.com/automationmojo/codecraftai-arcli.git", branch = "main" }
codecraftai-configuration = { git = "https://github.com/automationmojo/codecraftai-configuration.git", branch = "main" }
codecraftai-credentials = { git = "https://github.com/automationmojo/codecraftai-credentials.git", branch = "main" }
codecraftai-dataprofiles = { git = "https://github.com/automationmojo/codecraftai-dataprofiles.git", branch = "main" }
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", branch = "main" }
codecraftai-extension = { git = "https://github.com/automationmojo/codecraftai-extension.git", branch = "main" }
codecraftai-interfaces = { git = "https://github.com/automationmojo/codecraftai-interfaces.git", branch = "main" }
codecraftai-interop = { git = "https://github.com/automationmojo/codecraftai-interop.git", branch = "main" }
codecraftai-interop-ext-bluetooth = { git = "https://github.com/automationmojo/codecraftai-interop-ext-bluetooth.git", branch = "main" }
codecraftai-interop-ext-can = { git = "https://github.com/automationmojo/codecraftai-interop-ext-can.git", branch = "main" }
codecraftai-interop-ext-tasker = { git = "https://github.com/automationmojo/codecraftai-interop-ext-tasker.git", branch = "main" }
codecraftai-interop-ext-upnp = { git = "https://github.com/automationmojo/codecraftai-interop-ext-upnp.git", branch = "main" }
codecraftai-landscaping = { git = "https://github.com/automationmojo/codecraftai-landscaping.git", branch = "main" }
codecraftai-networking = { git = "https://github.com/automationmojo/codecraftai-networking.git", branch = "main" }
codecraftai-runtime = { git = "https://github.com/automationmojo/codecraftai-runtime.git", branch = "main" }
codecraftai-storage-database = { git = "https://github.com/automationmojo/codecraftai-storage-database.git", branch = "main" }
codecraftai-testbase = { git = "https://github.com/automationmojo/codecraftai-testbase.git", branch = "main" }
codecraftai-testplus = { git = "https://github.com/automationmojo/codecraftai-testplus.git", branch = "main" }
codecraftai-this-app = { git = "https://github.com/automationmojo/codecraftai-this-app.git", branch = "main" }
codecraftai-xmodules = { git = "https://github.com/automationmojo/codecraftai-xmodules.git", branch = "main" }

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
